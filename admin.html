<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin KDMP Pendowo Asri</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#FFF5F6;padding:14px}
  h1{font-size:22px} h2{font-size:18px;margin-top:28px}
  .card{background:#fff;border:1.5px solid #FFE1E5;border-radius:16px;padding:14px;margin-bottom:12px}
  input,textarea,select{width:100%;padding:11px;border:1.5px solid #FFE1E5;border-radius:12px;margin-bottom:8px;font-family:inherit}
  button{padding:11px 16px;border-radius:999px;border:0;font-weight:800;cursor:pointer}
  .btn-red{background:#FF0A2A;color:#fff} .btn-ghost{background:#fff;border:1.5px solid #FFD6DB;color:#FF0A2A}
  .row{display:flex;gap:10px;align-items:center} .row img{width:70px;height:70px;object-fit:cover;border-radius:50%;border:2px solid #FFE1E5}
  .item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:1px solid #FFE1E5;border-radius:12px;padding:10px;margin-bottom:8px}
  .item img{width:55px;height:55px;object-fit:cover;border-radius:50%}
  .tabs{display:flex;gap:8px;margin:14px 0} .tabs button{flex:1;background:#fff;border:1.5px solid #FFE1E5}
  .tabs button.active{background:#FF0A2A;color:#fff}
  .hidden{display:none}
</style>
</head>
<body>
<h1>🛠️ Admin KDMP Pendowo Asri</h1>
<a href="index.html">← Lihat Website</a>
<div class="tabs">
  <button id="tProduk" class="active" onclick="showTab('produk')">Produk</button>
  <button id="tBerita" onclick="showTab('berita')">Berita</button>
  <button id="tStruktur" onclick="showTab('struktur')">Struktur</button>
  <button id="tSetting" onclick="showTab('setting')">Setting</button>
</div>

<div id="tab-produk">
  <div class="card"><h2>+ Tambah Produk</h2>
    <input id="pNama" placeholder="Nama Produk">
    <div class="row"><input id="pHarga" type="number" placeholder="Harga"><input id="pStok" type="number" placeholder="Stok"></div>
    <select id="pKategori"><option value="dapur">Kebutuhan Dapur</option><option value="warung">Stok Warung</option></select>
    <input id="pEmoji" placeholder="Emoji (contoh 🍚)">
    <button class="btn-red" onclick="tambahProduk()">Simpan Produk</button>
  </div><div id="listProduk"></div>
</div>

<div id="tab-berita" class="hidden">
  <div class="card"><h2>+ Tambah Berita</h2>
    <input id="bJudul" placeholder="Judul Berita"><textarea id="bRingkasan" placeholder="Ringkasan"></textarea>
    <input id="bKategori" placeholder="Kategori (Informasi / Kegiatan)">
    <button class="btn-red" onclick="tambahBerita()">Simpan Berita</button>
  </div><div id="listBerita"></div>
</div>

<div id="tab-struktur">
  <div class="card"><h2>+ Tambah Pengurus + Foto</h2>
    <input id="sNama" placeholder="Nama Lengkap - Contoh: Bapak RT 01">
    <input id="sJabatan" placeholder="Jabatan - Contoh: Ketua">
    <input id="sDeskripsi" placeholder="Deskripsi singkat">
    <label style="font-size:13px;font-weight:700">Foto Pengurus:</label>
    <div class="row" style="margin:8px 0">
      <img id="sPreview" src="" style="display:none">
      <span id="sNoFoto" style="font-size:13px;color:#888">Belum ada foto</span>
      <input type="file" id="sFoto" accept="image/*" onchange="previewFoto(event)" style="border:0;padding:0">
    </div>
    <button class="btn-red" onclick="tambahStruktur()">Simpan Pengurus</button>
    <button class="btn-ghost" onclick="resetStrukturForm()">Batal / Reset</button>
  </div><div id="listStruktur"></div>
</div>

<div id="tab-setting" class="hidden">
  <div class="card"><h2>Setting WA Kasir</h2>
    <input id="setWa" placeholder="Nomor WA - Contoh: 6281234567890 (pakai 62, jangan 0)">
    <input id="setKasir" placeholder="Nama Kasir">
    <button class="btn-red" onclick="simpanSetting()">Simpan Setting</button>
  </div>
</div>

<script>
  function getData(k){ try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []} }
  function setData(k,v){ localStorage.setItem(k,JSON.stringify(v)); renderAll(); }
  function showTab(t){ ['produk','berita','struktur','setting'].forEach(x=>{ document.getElementById('tab-'+x).classList.toggle('hidden',x!==t); document.getElementById('t'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===t); }); }
  let fotoStrukturTemp = '';
  function previewFoto(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=function(ev){ fotoStrukturTemp=ev.target.result; const img=document.getElementById('sPreview'); img.src=fotoStrukturTemp; img.style.display='block'; document.getElementById('sNoFoto').style.display='none'; }; r.readAsDataURL(f); }
  function resetStrukturForm(){ document.getElementById('sNama').value=''; document.getElementById('sJabatan').value=''; document.getElementById('sDeskripsi').value=''; document.getElementById('sFoto').value=''; fotoStrukturTemp=''; document.getElementById('sPreview').style.display='none'; document.getElementById('sNoFoto').style.display='block'; }
  function tambahStruktur(){ const nama=document.getElementById('sNama').value.trim(); const jabatan=document.getElementById('sJabatan').value.trim(); if(!nama||!jabatan) return alert('Nama & Jabatan wajib diisi bre!'); const d=getData('kdmp_struktur'); d.push({nama,jabatan,deskripsi:document.getElementById('sDeskripsi').value, foto:fotoStrukturTemp}); setData('kdmp_struktur',d); resetStrukturForm(); alert('Pengurus berhasil ditambah!'); }
  function hapusStruktur(i){ if(!confirm('Hapus pengurus ini?')) return; const d=getData('kdmp_struktur'); d.splice(i,1); setData('kdmp_struktur',d); }
  function tambahProduk(){ const nama=document.getElementById('pNama').value.trim(); if(!nama) return alert('Nama produk wajib!'); const d=getData('kdmp_produk'); d.push({nama,kategori:document.getElementById('pKategori').value,harga:Number(document.getElementById('pHarga').value)||0,stok:Number(document.getElementById('pStok').value)||0,emoji:document.getElementById('pEmoji').value||'📦',deskripsi:'',foto:''}); setData('kdmp_produk',d); }
  function hapusProduk(i){ if(!confirm('Hapus produk?')) return; const d=getData('kdmp_produk'); d.splice(i,1); setData('kdmp_produk',d); }
  function tambahBerita(){ const judul=document.getElementById('bJudul').value.trim(); if(!judul) return alert('Judul wajib!'); const d=getData('kdmp_berita'); d.push({judul,ringkasan:document.getElementById('bRingkasan').value,kategori:document.getElementById('bKategori').value||'Berita'}); setData('kdmp_berita',d); }
  function hapusBerita(i){ if(!confirm('Hapus berita?')) return; const d=getData('kdmp_berita'); d.splice(i,1); setData('kdmp_berita',d); }
  function simpanSetting(){ localStorage.setItem('kdmp_setting',JSON.stringify({wa:document.getElementById('setWa').value, kasir:document.getElementById('setKasir').value})); alert('Setting tersimpan!'); }
  function renderAll(){
    document.getElementById('listProduk').innerHTML=getData('kdmp_produk').map((x,i)=>`<div class="item"><span>${x.emoji} ${x.nama} - Rp ${x.harga}</span><button class="btn-ghost" onclick="hapusProduk(${i})">Hapus</button></div>`).join('');
    document.getElementById('listBerita').innerHTML=getData('kdmp_berita').map((x,i)=>`<div class="item"><span><b>${x.judul}</b><br>${x.ringkasan||''}</span><button class="btn-ghost" onclick="hapusBerita(${i})">Hapus</button></div>`).join('');
    document.getElementById('listStruktur').innerHTML=getData('kdmp_struktur').map((x,i)=>`<div class="item"><div style="display:flex;gap:10px;align-items:center">${x.foto?`<img src="${x.foto}">`:`<div style="width:55px;height:55px;border-radius:50%;background:#FFF0F1;display:flex;align-items:center;justify-content:center">👤</div>`}<span><b>${x.nama}</b><br>${x.jabatan}</span></div><button class="btn-ghost" onclick="hapusStruktur(${i})">Hapus</button></div>`).join('');
    try{ const s=JSON.parse(localStorage.getItem('kdmp_setting'))||{}; document.getElementById('setWa').value=s.wa||''; document.getElementById('setKasir').value=s.kasir||''; }catch(e){}
  }
  renderAll();
</script>
</body>
</html>
