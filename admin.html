
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin | KDMP Pendowo Asri</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff5f5, #f8dfe2);
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(120,21,33,.12);
    }
    h1 { color: #b91c2c; margin-bottom: 8px; }
    p { color: #666; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; font-weight: bold; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: #b91c2c;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message { margin-top: 16px; font-size: 14px; }
    .back { display: block; margin-top: 20px; color: #b91c2c; text-align: center; }
  </style>
</head>
<body>
  <main class="login-box">
    <h1>Login Admin</h1>
    <p>KDMP Pendowo Asri<br>Silakan masuk menggunakan akun manajer.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">

      <button id="loginButton" type="submit">Masuk Dashboard</button>
      <div id="message" role="status"></div>
    </form>

    <a class="back" href="index.html">← Kembali ke website</a>
  </main>

  <script>
    const SUPABASE_URL = "https://ntelnblacqrwunjctxwd.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_xxxxxxxxx";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Memeriksa...";
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "Login gagal: " + error.message;
        message.style.color = "#b91c2c";
        button.disabled = false;
        button.textContent = "Masuk Dashboard";
        return;
      }

      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
