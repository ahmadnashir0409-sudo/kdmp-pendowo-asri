<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin KDMP</title>
<style>body{font-family:Arial;background:#fff8e1;margin:0;padding:16px}h1{text-align:center}input,select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}button{width:100%;padding:14px;background:#FFD500;border:0;border-radius:10px;font-weight:bold;font-size:17px} .card{background:#fff;padding:14px;border-radius:12px;margin-top:14px}</style></head><body>
<div id="login"><h1>🔒 Admin KDMP</h1><p style="text-align:center">Khusus HP Bos (Lu & Admin)</p><input id="pass" type="password" placeholder="Password admin"><button onclick="cek()">MASUK</button></div>

<div id="panel" style="display:none">
<h1>Tambah / Edit Stok</h1>
<div class="card"><label>Nama Produk</label><input id="nama" placeholder="Contoh: Beras 10 Kg">
<label>Harga</label><input id="harga" type="number" placeholder="150000">
<label>Stok</label><input id="stok" type="number" placeholder="20">
<label>Kategori</label><select id="kat"><option value="dapur">Dapur</option><option value="warung">Warung</option></select>
<button onclick="simpan()">💾 SIMPAN KE SHEETS</button><p id="status"></p></div>
<p style="text-align:center;font-size:13px">Data langsung masuk ke Google Sheets & web warga auto berubah.<br><a href="index.html">Lihat Web Warga</a></p>
</div>

<script>
function cek(){
  if(document.getElementById('pass').value==='admin123'){
    document.getElementById('login').style.display='none';
    document.getElementById('panel').style.display='block';
  } else alert('Password salah bre!');
}
async function simpan(){
  let data={nama:document.getElementById('nama').value,harga:document.getElementById('harga').value,stok:document.getElementById('stok').value,kategori:document.getElementById('kat').value,deskripsi:""};
  if(!data.nama||!data.harga) return alert('Isi nama & harga dulu!');
  document.getElementById('status').innerText='Menyimpan...';
  // GANTI LINK INI DENGAN LINK APPS SCRIPT LU
  const SCRIPT_URL="PASTE_LINK_APPS_SCRIPT_DI_SINI";
  try{ await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(data)}); document.getElementById('status').innerText='✅ Berhasil! Cek Sheets & web.'; document.getElementById('nama').value=''; }catch(e){ document.getElementById('status').innerText='Gagal, cek link Apps Script.'; }
}
</script></body></html>
