<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KDMP Pendowo Asri</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fff8e1}
header{background:#FFD500;padding:18px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;font-size:13px}
.search{padding:12px} .search input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px}
.filter{padding:0 12px;display:flex;gap:8px} .filter button{flex:1;padding:10px;border-radius:20px;border:1px solid #ddd;background:#fff}
.filter button.active{background:#000;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card .icon{font-size:42px}.card h3{font-size:15px;margin:8px 0 4px;min-height:38px}
.card .stok{font-size:12px;color:#666}.card .harga{font-weight:bold;font-size:17px;margin:6px 0}
.card a{display:block;background:#25D366;color:#fff;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:14px}
.berita{padding:0 12px 20px}.berita .item{background:#fff;padding:12px;border-radius:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
</style></head><body>
<header><h1>KDMP PENDOWO ASRI</h1><p>Koperasi Desa Merah Putih • Pendowo Asri</p></header>
<div class="search"><input id="cari" placeholder="🔍 Cari produk... Beras, Minyak..." oninput="tampil()"></div>
<div class="filter">
<button onclick="setKat('semua',this)" class="active">Semua</button>
<button onclick="setKat('dapur',this)">Dapur</button>
<button onclick="setKat('warung',this)">Warung</button>
</div>
<div id="list" class="grid"><p style="grid-column:1/3;text-align:center">Memuat produk...</p></div>
<div class="berita"><h3>📢 Berita / Pengumuman</h3><div id="beritaList"></div></div>

<script>
// GANTI LINK INI DENGAN LINK CSV SHEETS LU YANG TAB PRODUK
const SHEET_PRODUK = "PASTE_LINK_CSV_PRODUK_DI_SINI";
const SHEET_BERITA = "PASTE_LINK_CSV_BERITA_DI_SINI";
let allData=[]; let katAktif='semua';

function iconFor(nama){
  nama=nama.toLowerCase();
  if(nama.includes('beras')) return '🍚';
  if(nama.includes('minyak')) return '🛢️';
  if(nama.includes('gula')) return '🍬';
  if(nama.includes('telur')) return '🥚';
  if(nama.includes('mie')||nama.includes('indomie')) return '🍜';
  if(nama.includes('kopi')) return '☕';
  return '🛒';
}
async function load(){
  try{
    let r=await fetch(SHEET_PRODUK); let t=await r.text();
    let rows=t.split('\n').slice(1);
    allData=rows.map(r=>{
      let c=r.split(','); return {nama:c[0],harga:c[1],stok:c[2],kategori:(c[3]||'').toLowerCase(),deskripsi:c[5]||''}
    }).filter(x=>x.nama);
    tampil();
  }catch(e){ document.getElementById('list').innerHTML='<p>Gagal load. Cek link Sheets.</p>' }
}
function setKat(k,btn){ katAktif=k; document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); tampil(); }
function tampil(){
  let q=document.getElementById('cari').value.toLowerCase();
  let f=allData.filter(x=>(katAktif=='semua'||x.kategori.includes(katAktif)) && x.nama.toLowerCase().includes(q));
  document.getElementById('list').innerHTML=f.map(x=>`
    <div class="card"><div class="icon">${iconFor(x.nama)}</div><h3>${x.nama}</h3><div class="stok">Stok: ${x.stok}</div><div class="harga">Rp ${Number(x.harga).toLocaleString('id-ID')}</div><a href="https://wa.me/6280000000000?text=Halo%20saya%20mau%20pesan%20${encodeURIComponent(x.nama)}">Pesan via WhatsApp</a></div>
  `).join('') || '<p style="grid-column:1/3;text-align:center">Produk tidak ditemukan</p>';
}
load();
</script></body></html>
