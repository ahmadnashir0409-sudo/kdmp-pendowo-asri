<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDMP Pendowo Asri</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#FFF3C4;color:#1a1a1a}
header{background:#c81e1e;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.logo{font-weight:900;font-size:18px}.logo small{display:block;font-size:10px;font-weight:400;opacity:.9}
nav{display:none;gap:16px}@media(min-width:800px){nav{display:flex}} nav a{color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.tab{padding:10px 18px;border-radius:999px;border:2px solid #c81e1e;background:#fff;color:#c81e1e;font-weight:800;cursor:pointer}
.tab.active{background:#c81e1e;color:#fff}
.grid{display:grid;gap:16px}@media(min-width:750px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:#fff;border-radius:16px;overflow:hidden;border:2px solid #e8c547;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,.15)}
.card img{width:100%;height:180px;object-fit:cover;background:#eee}
.card .in{padding:14px}
.card h3{font-size:16px;margin:6px 0}.card p{font-size:13px;color:#555;line-height:1.5}
.badge{font-size:11px;background:#ffcc00;padding:4px 8px;border-radius:999px;font-weight:800}
.klik{font-size:12px;color:#c81e1e;font-weight:800;margin-top:10px}
/* POPUP BERITA */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:600px;border-radius:18px;overflow:hidden;max-height:90vh;overflow-y:auto}
.modal-box img{width:100%;height:260px;object-fit:cover}
.modal-box .in{padding:20px}
.modal-box h2{font-size:22px;margin:8px 0}
.modal-box p{color:#333;line-height:1.7;font-size:15px;white-space:pre-line}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:16px}
.btn-tutup{background:#111;color:#fff}
.btn-wa{background:#25D366;color:#fff;margin-top:8px}
.belanja{background:#ff5a8a;color:#fff;text-align:center;padding:14px;border-radius:12px;font-weight:900;margin-top:20px}
</style>
</head>
<body>
<header>
<div class="logo">KDMP PENDOWO ASRI<small>Koperasi Desa Merah Putih - Pendowo Asri</small></div>
<nav><a href="#">Beranda</a><a href="#berita">Berita</a><a href="#produk">Produk</a></nav>
</header>

<div class="wrap">
<h2 style="text-align:center">Berita Koperasi</h2>
<p style="text-align:center;color:#5a3d00;font-size:14px;margin:6px 0">Klik berita untuk baca selengkapnya</p>

<div class="tabs">
<button class="tab active" onclick="filterBerita('all',this)">Semua</button>
<button class="tab" onclick="filterBerita('Rapat',this)">Rapat</button>
<button class="tab" onclick="filterBerita('Pengumuman',this)">Pengumuman</button>
</div>

<div class="grid" id="beritaList">
<!-- CONTOH DATA - NANTI KEISI OTOMATIS DARI SHEETS -->
</div>

<div class="belanja">🛒 Belanja Kebutuhan Dapur</div>
</div>

<!-- MODAL DETAIL BERITA -->
<div class="modal" id="modalBerita" onclick="if(event.target==this) tutupBerita()">
<div class="modal-box">
<img id="mFoto" src="">
<div class="in">
<span class="badge" id="mKategori">BERITA</span>
<h2 id="mJudul">Judul Berita</h2>
<p id="mTanggal" style="color:#888;font-size:13px"></p>
<p id="mIsi" style="margin-top:12px">Isi berita...</p>
<button class="btn btn-wa" onclick="tanyaWA()">💬 Tanya via WhatsApp</button>
<button class="btn btn-tutup" onclick="tutupBerita()">Tutup ✕</button>
</div>
</div>
</div>

<script>
// GANTI LINK INI DENGAN LINK CSV GOOGLE SHEETS BERITA LU YANG LAMA BRE!
const SHEETS_URL = "https://docs.google.com/spreadsheets/d/PASTE_ID_SHEETS_LU/gviz/tq?tqx=out:csv&sheet=Berita";
let semuaBerita = [];

// DATA CADANGAN KALO SHEETS BELUM KELOAD - BIAR LU BISA TES KLIK DULU
const contohBerita = [
{judul:"rapat anggota tahunan", kategori:"Rapat", tanggal:"13 Nov 2026", foto:"gedung-kdmp-2.jpg", isi:"Rapat Anggota Tahunan KDMP Pendowo Asri akan dilaksanakan di Gedung Koperasi. Seluruh anggota diharapkan hadir tepat waktu. Membawa KTP dan kartu anggota.\n\nAgenda: Laporan keuangan, pemilihan pengurus, dan rencana kerja tahun depan."},
{judul:"Pengumuman Jam Buka Koperasi", kategori:"Pengumuman", tanggal:"12 Nov 2026", foto:"peta-pendowoasri.jpeg", isi:"Koperasi buka Senin - Sabtu jam 08.00 - 16.00 WIB. Minggu tutup. Layanan Warung ditutup sementara menunggu Juklak Juknis. Layanan Dapur tetap buka."},
{judul:"Stok Baru Sembako Masuk", kategori:"Pengumuman", tanggal:"10 Nov 2026", foto:"gedung-kdmp-2.jpg", isi:"Stok baru sudah masuk: Beras, Minyak Goreng, Gula, Telur, dan kebutuhan dapur lainnya. Silakan cek di katalog dan order via WhatsApp."}
];

function tampilkanBerita(data){
  const list = document.getElementById('beritaList');
  list.innerHTML = "";
  data.forEach((b,i)=>{
    const div = document.createElement('div');
    div.className = 'card';
    div.onclick = ()=> bukaBerita(i);
    div.innerHTML = `
      <img src="${b.foto}" onerror="this.src='https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=800&q=80'">
      <div class="in">
        <span class="badge">${b.kategori}</span>
        <h3>${b.judul}</h3>
        <p>${b.isi.substring(0,80)}...</p>
        <div class="klik">Klik untuk baca selengkapnya →</div>
      </div>`;
    list.appendChild(div);
  });
}

function bukaBerita(i){
  const b = semuaBerita[i];
  document.getElementById('mFoto').src = b.foto;
  document.getElementById('mJudul').textContent = b.judul;
  document.getElementById('mKategori').textContent = b.kategori;
  document.getElementById('mTanggal').textContent = b.tanggal;
  document.getElementById('mIsi').textContent = b.isi;
  document.getElementById('modalBerita').classList.add('open');
}
function tutupBerita(){ document.getElementById('modalBerita').classList.remove('open'); }
function tanyaWA(){
  const judul = document.getElementById('mJudul').textContent;
  window.open(`https://wa.me/6285782102726?text=Halo%20Min%2C%20saya%20mau%20tanya%20tentang%20berita%20${encodeURIComponent(judul)}`, '_blank');
}
function filterBerita(kat, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(kat=='all') tampilkanBerita(semuaBerita);
  else tampilkanBerita(semuaBerita.filter(b=>b.kategori.toLowerCase().includes(kat.toLowerCase())));
}

// LOAD DARI SHEETS, KALO GAGAL PAKE DATA CONTOH
semuaBerita = contohBerita;
tampilkanBerita(semuaBerita);

// KALO LU UDAH PASANG LINK SHEETS YANG BENER, INI AKAN JALAN OTOMATIS
// fetch(SHEETS_URL).then(r=>r.text()).then(csv=>{
//   // parsing CSV Sheets lu disini, format: Judul,Kategori,Tanggal,Foto,Isi
// });

</script>
</body>
</html>
