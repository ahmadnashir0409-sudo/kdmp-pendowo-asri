<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDMP Pendowo Asri - Gerai</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui} .kuning{background:#FFD500}</style>
</head>
<body class="bg-gray-50">
<!-- HEADER -->
<div class="kuning p-4 sticky top-0 z-10 shadow">
  <h1 class="font-black text-xl">KDMP PENDOWO ASRI</h1>
  <p class="text-xs font-bold">Gerai Koperasi • Bandar Lampung</p>
</div>

<div class="p-4 max-w-3xl mx-auto">
  <div class="flex gap-2 mb-4">
    <button onclick="filterCat('semua')" class="bg-black text-white px-4 py-2 rounded-full text-sm font-bold">Semua</button>
    <button onclick="filterCat('dapur')" class="bg-white border px-4 py-2 rounded-full text-sm font-bold">Dapur</button>
    <button onclick="filterCat('warung')" class="bg-white border px-4 py-2 rounded-full text-sm font-bold">Warung</button>
  </div>
  <div id="loading" class="text-center py-10 font-bold">Loading dari Google Sheets...</div>
  <div id="list" class="grid grid-cols-2 gap-3"></div>
  <div id="berita" class="mt-8"></div>
</div>

<script>
const SHEET_ID = "1gQkhDHcgmPRLiIlBl8TXS_DuulRnUwn2a1Z2D-UHQFY";
let allProduk = [];
let cat = 'semua';

async function getSheet(sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;
  const res = await fetch(url);
  const text = await res.text();
  // CSV parser sederhana
  const rows = text.split("\n").map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'').trim()));
  const header = rows[0];
  return rows.slice(1).filter(r=>r[0]).map(r=>{
    let o={}; header.forEach((h,i)=> o[h]=r[i]||''); return o;
  });
}

function render(){
  const list = document.getElementById('list');
  const filtered = allProduk.filter(p=> cat==='semua' || (p.Kategori||'').toLowerCase()===cat);
  list.innerHTML = filtered.map(p=>`
    <div class="bg-white rounded-2xl overflow-hidden shadow border">
      <div class="h-28 bg-yellow-100 flex items-center justify-center text-5xl">${p.Kategori==='dapur'?'🍚':'🛒'}</div>
      <div class="p-3">
        <div class="font-bold text-sm leading-tight">${p.Nama}</div>
        <div class="text-xs text-gray-500">Stok: ${p.Stok}</div>
        <div class="font-black text-red-600 mt-1">Rp ${Number(p.Harga||0).toLocaleString('id-ID')}</div>
        <a target="_blank" href="https://wa.me/6280000000000?text=Halo, saya mau pesan ${encodeURIComponent(p.Nama)}" class="block text-center bg-green-500 text-white text-xs font-bold py-2 rounded-full mt-2">Pesan WA</a>
      </div>
    </div>`).join('') || '<p class="col-span-2 text-center">Belum ada produk. Cek Sheets.</p>';
}

function filterCat(c){ cat=c; render(); }

async function init(){
  try{
    allProduk = await getSheet('Produk');
    const berita = await getSheet('Berita');
    document.getElementById('loading').style.display='none';
    render();
    document.getElementById('berita').innerHTML = '<h2 class="font-black text-lg mb-3">Berita / Pengumuman</h2>' + berita.map(b=>`<div class="bg-white p-4 rounded-xl border mb-2"><b>${b.Judul}</b><div class="text-xs text-red-600 font-bold">${b.Kategori}</div><p class="text-sm text-gray-600">${b.Ringkasan}</p></div>`).join('');
  }catch(e){ document.getElementById('loading').innerText='Gagal load. Cek Sheets sudah di-Share ke Siapa saja?'; }
}
init();
</script>
</body>
</html>
